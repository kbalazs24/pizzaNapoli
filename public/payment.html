<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Payment | PIZZA NAPOLI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="js/cart-storage.js" defer></script>
  <script src="js/payment.js" defer></script>
</head>
<body>
  <header class="site-header border-bottom">
    <div class="container py-3">
      <a class="brand text-decoration-none" href="index.html">
        <strong>PIZZA <span>NAPOLI</span></strong>
        <small>NEAPOLITAN PIZZA</small>
      </a>
    </div>
  </header>
  <main class="container py-5">
    <div class="payment-panel mx-auto">
      <div id="payment-details">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h2 mb-0">Card payment</h1>
          <span class="badge text-bg-secondary">DEMO</span>
        </div>
        <p class="text-muted">This is a simulated payment. No real money is charged. Never enter real card details.</p>
        <div class="payment-total mb-4">
          <div class="small">Amount to pay</div>
          <div class="h2 mb-1" id="payment-amount">Loading...</div>
        </div>
        <div class="demo-card-info mb-4">
          <p class="fw-bold mb-2">Demo card</p>
          <p class="mb-1">Card number: <code>4242 4242 4242 4242</code></p>
          <p class="mb-0">Expiry: <code>12/30</code> · CVC: <code>123</code></p>
        </div>
      </div>
      <form id="payment-form" hidden novalidate>
        <label class="form-label" for="card-name">Name on card</label>
        <input class="form-control mb-3" id="card-name" autocomplete="off" maxlength="100" placeholder="TEST CUSTOMER" pattern=".*\S.*" title="Enter the name on the card." aria-describedby="card-name-error" required>
        <div id="card-name-error" class="text-danger small mb-3" role="alert" hidden></div>
        <label class="form-label" for="card-number">Card number (DEMO only)</label>
        <input class="form-control mb-3" id="card-number" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242" pattern=" *(?:[0-9] *){16}" title="Enter a 16-digit card number." aria-describedby="card-number-error" required>
        <div id="card-number-error" class="text-danger small mb-3" role="alert" hidden></div>
        <div class="row g-3 mb-4">
          <div class="col-6">
            <label class="form-label" for="card-expiry">Expiry (MM/YY)</label>
            <input class="form-control" id="card-expiry" inputmode="numeric" autocomplete="off" placeholder="12/30" pattern="(0[1-9]|1[0-2])/[0-9]{2}" title="Enter the expiry date in MM/YY format." aria-describedby="card-expiry-error" required>
            <div id="card-expiry-error" class="text-danger small mb-3" role="alert" hidden></div>
          </div>
          <div class="col-6">
            <label class="form-label" for="card-cvc">CVC (DEMO)</label>
            <input class="form-control" id="card-cvc" inputmode="numeric" autocomplete="off" placeholder="123" pattern="[0-9]{3}" title="Enter a 3-digit CVC." aria-describedby="card-cvc-error" required>
            <div id="card-cvc-error" class="text-danger small mb-3" role="alert" hidden></div>
          </div>
        </div>
        <button class="btn btn-brand w-100" id="pay-button" type="submit">Pay (DEMO)</button>
      </form>
      <p id="payment-message" role="status" class="mt-3" aria-live="polite"></p>
      <a href="payment.html" id="retry-payment" class="btn btn-brand mt-2" hidden>Retry payment</a>
      <a href="index.html" class="d-inline-block mt-2">Back to main menu</a>
    </div>
  </main>
</body>
</html>
